# ===== EXAMVAULT BASE APPLICATION CONFIGURATION =====
# This is the base configuration - profile-specific settings are in separate files

# Import external secrets file
spring:
  config:
    import:
      - optional:file:./../secrets.yml
      - optional:file:./config/secrets.yml
      - optional:classpath:secrets.yml

# ===== APPLICATION BASIC SETTINGS =====
spring:
  application:
    name: ExamVault

server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: false

# ===== DATABASE CONFIGURATION =====
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/examvault
    driver-class-name: org.postgresql.Driver
    # Username and password loaded from secrets.yml
    
    # ===== CONNECTION POOL SETTINGS (HikariCP) =====
    hikari:
      connection-timeout: 20000
      minimum-idle: 5
      maximum-pool-size: 10
      idle-timeout: 600000
      max-lifetime: 1800000
      
      # PostgreSQL specific optimizations
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true

  # ===== JPA/HIBERNATE CONFIGURATION =====
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        # Critical: Enable PostgreSQL array support
        type:
          preferred_instant_jdbc_type: TIMESTAMP
        # Performance optimizations
        jdbc:
          batch_size: 20
          batch_versioned_data: true
        order_inserts: true
        order_updates: true

  # ===== FLYWAY MIGRATION SETTINGS =====
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false
    clean-disabled: true
    postgresql-transactional-lock: false

  # ===== SECURITY CONFIGURATION =====
  security:
    oauth2:
      client:
        registration:
          google:
            # Client ID and secret loaded from secrets.yml
            scope:
              - openid
              - profile
              - email
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v2/userinfo
            user-name-attribute: email

  # ===== JSON CONFIGURATION =====
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

# ===== APPLICATION-SPECIFIC CONFIG =====
app:
  exam:
    max-questions-per-exam: 100
    max-tags-per-exam: 10
    max-tag-length: 50
  
  comments:
    max-length: 1000
    enable-moderation: false
  
  security:
    cors:
      allowed-origins: 
        - http://localhost:3000
        - http://localhost:8080
      allowed-methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      allowed-headers:
        - "*"
      allow-credentials: true

# ===== LOGGING CONFIGURATION =====
logging:
  level:
    root: INFO
    com.howell.examvault: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE